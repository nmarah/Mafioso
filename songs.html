<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>غنّيها بالفصحى</title>
<meta name="theme-color" content="#15110f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#15110f; --panel:#211b17; --panel2:#2b231d; --line:#3a3029;
  --text:#f3ead8; --muted:#a8998a; --gold:#d4af37; --gold2:#f0cf63;
  --good:#3fbf6f; --bad:#e5484d; --warn:#f0a43a;
  --ring:#d4af37;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
  min-height:100dvh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
h1,h2,.kufi{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0}
input{font:inherit}
.hidden{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:16px}

/* ---------- setup ---------- */
.hero{text-align:center;padding:24px 0 8px}
.hero h1{margin:0;font-size:clamp(30px,7vw,52px);color:var(--gold2);letter-spacing:.5px}
.hero p{margin:8px auto 0;color:var(--muted);max-width:560px;line-height:1.8}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
.card h2{margin:0 0 12px;font-size:20px;color:var(--gold)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.add input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:14px;font-size:18px;outline:none;user-select:text;-webkit-user-select:text}
.add input:focus{border-color:var(--gold)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-weight:700;font-size:16px}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:#1a1307;border-color:var(--gold)}
.btn.good{background:var(--good);color:#06210f;border-color:var(--good)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.big{font-size:20px;padding:16px 26px;border-radius:14px}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:8px 8px 8px 14px;font-size:17px}
.chip .dot{width:12px;height:12px;border-radius:50%}
.chip button{background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:0 6px}
.empty{color:var(--muted);margin-top:12px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.set{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border-radius:12px;padding:10px 12px;gap:8px}
.set label{color:var(--muted);font-size:15px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:18px}
.step b{min-width:34px;text-align:center;font-size:18px}
.toggle{width:52px;height:30px;border-radius:999px;background:var(--bg);border:1px solid var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.toggle.on{background:var(--gold);border-color:var(--gold)}
.toggle.on::after{right:25px;background:#1a1307}
.start{display:flex;justify-content:center;margin:22px 0 10px}

/* ---------- game ---------- */
#game{display:flex;flex-direction:column;min-height:100dvh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.topbar .title{font-family:"Reem Kufi";color:var(--gold2);font-size:20px}
.topbar .round{color:var(--muted);font-size:14px}
.iconbtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}

.song{margin:12px 16px 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.song .lbl{color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:8px}
.song .lyric{font-family:"Reem Kufi";font-size:clamp(20px,4.2vw,30px);line-height:1.7;margin:6px 0;color:var(--text);min-height:1.7em}
.song .lyric{white-space:pre-line}
.song .answer{border-top:1px dashed var(--line);margin-top:8px;padding-top:10px;animation:fade .35s}
.song .answer.blur{display:none}
.song .answer .t{color:var(--gold2);font-weight:700;font-size:19px}
.song .answer .o{white-space:pre-line;font-size:clamp(17px,3.4vw,22px);line-height:1.8;margin-top:6px;color:var(--text);
  background:var(--panel2);border-radius:12px;padding:10px 14px;border-right:4px solid var(--gold)}
.song .answer .ol{color:var(--muted);font-size:13px;margin-top:8px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.song .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.song .acts .btn{padding:8px 14px;font-size:14px}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 16px;gap:14px}
.status{text-align:center;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.status .msg{font-family:"Reem Kufi";font-size:clamp(20px,4.5vw,30px)}
.status .sub{color:var(--muted);font-size:14px}

.answering{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.timer{position:relative;width:132px;height:132px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:10}
.timer .bgc{stroke:var(--panel2)}
.timer .fg{stroke:var(--ring);stroke-linecap:round;transition:stroke .3s}
.timer .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Reem Kufi";font-size:44px}
.timer.low .fg{stroke:var(--bad)}
.timer.low .num{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.who{font-family:"Reem Kufi";font-size:clamp(28px,6vw,44px)}
.judge{display:flex;gap:10px}

.bells{display:grid;gap:12px;width:100%;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.bell{position:relative;border-radius:22px;padding:14px 10px 12px;background:var(--panel);border:2px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:8px;touch-action:none;transition:transform .08s,opacity .2s,border-color .2s}
.bell .dome{width:min(110px,26vw);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff6 0,#fff0 35%),var(--c);
  box-shadow:0 8px 0 rgba(0,0,0,.45),inset 0 -8px 18px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:40px}
.bell .nm{font-weight:700;font-size:19px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bell .sc,.rank .s,.bell .delta{direction:ltr;unicode-bidi:isolate}
.bell .sc{font-family:"Reem Kufi";font-size:26px;color:var(--gold2)}
.bell .key{position:absolute;top:8px;left:10px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.bell .adj{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.bell .adj button{width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:15px;line-height:1;color:var(--muted)}
.bell:active .dome,.bell.press .dome{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 -8px 18px rgba(0,0,0,.35)}
.armed .bell{border-color:var(--gold)}
.armed .bell .dome{animation:ready 1.4s ease-in-out infinite}
@keyframes ready{50%{filter:brightness(1.25)}}
.bell.out{opacity:.28}
.bell.out .dome{animation:none!important;filter:grayscale(1)}
.bell.first{border-color:var(--gold2);transform:scale(1.04);box-shadow:0 0 0 4px #d4af3755,0 0 40px #d4af3766;opacity:1}
.bell.first .dome{animation:ring .5s ease-in-out 3}
@keyframes ring{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.bell .delta{position:absolute;top:40%;font-family:"Reem Kufi";font-size:40px;pointer-events:none;animation:float 1.1s ease-out forwards}
@keyframes float{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}

.host{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 16px 18px}

/* ---------- end ---------- */
.podium{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.rank{display:flex;align-items:center;gap:12px;background:var(--panel2);border-radius:14px;padding:12px 16px;font-size:20px}
.rank .pos{font-family:"Reem Kufi";width:40px;text-align:center;font-size:26px}
.rank .n{flex:1;font-weight:700}
.rank .s{font-family:"Reem Kufi";color:var(--gold2);font-size:24px}
.rank.r1{background:linear-gradient(90deg,#d4af3733,var(--panel2));border:1px solid var(--gold)}

@media (max-width:520px){
  .bells{grid-template-columns:repeat(2,1fr);gap:10px}
  .timer{width:108px;height:108px}
  .timer .num{font-size:36px}
}
</style>
</head>
<body>

<!-- ============ SETUP ============ -->
<section id="setup" class="wrap">
  <div class="hero">
    <h1>غنّيها بالفصحى 🔔</h1>
    <p>المقدّم بيحكي كلام أغنية بالفصحى، واللاعبين بيخمّنوا شو هي الأغنية الأصلية. أوّل واحد بيضرب الجرس بيجاوب، ومعه وقت محدّد.</p>
  </div>

  <div class="card">
    <h2>اللاعبين</h2>
    <form class="row add" id="addForm" autocomplete="off">
      <input id="nameIn" placeholder="اكتب اسم اللاعب واضغط إضافة" maxlength="18">
      <button class="btn gold" type="submit">إضافة</button>
    </form>
    <div class="chips" id="chips"></div>
    <div class="empty" id="emptyMsg">ضيف لاعبين على الأقل لتبدأ.</div>
  </div>

  <div class="card">
    <h2>الإعدادات</h2>
    <div class="settings">
      <div class="set"><label>وقت الجواب (ثانية)</label><div class="step" data-k="time" data-min="5" data-max="120" data-st="5"><button>−</button><b></b><button>+</button></div></div>
      <div class="set"><label>نقاط الجواب الصح</label><div class="step" data-k="right" data-min="1" data-max="10" data-st="1"><button>−</button><b></b><button>+</button></div></div>
      <div class="set"><label>خصم الجواب الغلط</label><div class="step" data-k="wrong" data-min="0" data-max="10" data-st="1"><button>−</button><b></b><button>+</button></div></div>
      <div class="set"><label>خصم إذا خلص الوقت وما جاوب</label><div class="step" data-k="timeout" data-min="0" data-max="10" data-st="1"><button>−</button><b></b><button>+</button></div></div>
      <div class="set"><label>بعد الغلط، الباقيين بيقدروا يضربوا الجرس</label><button class="toggle" data-t="reopen"></button></div>
      <div class="set"><label>اقتراحات أغاني جاهزة بالفصحى</label><button class="toggle" data-t="bank"></button></div>
    </div>
  </div>

  <div class="start"><button class="btn gold big" id="startBtn" disabled>ابدأ اللعبة</button></div>
</section>

<!-- ============ GAME ============ -->
<section id="game" class="hidden">
  <div class="topbar">
    <button class="iconbtn" id="backBtn">الإعدادات</button>
    <div style="text-align:center"><div class="title">غنّيها بالفصحى</div><div class="round" id="roundLbl"></div></div>
    <button class="iconbtn" id="endBtn">إنهاء</button>
  </div>

  <div class="song" id="songBox">
    <div class="lbl"><span>اقرأها للاعبين بالفصحى:</span><span id="songCount"></span></div>
    <div class="lyric" id="lyric"></div>
    <div class="answer blur" id="answer"><div class="t" id="ansTitle"></div><div class="ol">الكلام الأصلي:</div><div class="o" id="ansOrig"></div></div>
    <div class="acts">
      <button class="btn" id="revealBtn">إظهار الجواب</button>
      <button class="btn" id="skipBtn">أغنية ثانية</button>
    </div>
  </div>

  <div class="stage">
    <div class="status" id="status"></div>
    <div class="bells" id="bells"></div>
  </div>
  <div class="host" id="host"></div>
</section>

<!-- ============ END ============ -->
<section id="end" class="wrap hidden">
  <div class="hero"><h1>النتيجة 🏆</h1><p id="endSub"></p></div>
  <div class="card"><div class="podium" id="podium"></div></div>
  <div class="start" style="gap:10px">
    <button class="btn" id="resumeBtn">رجوع للعبة</button>
    <button class="btn gold big" id="againBtn">جولة جديدة بنفس اللاعبين</button>
  </div>
</section>

<script>
(() => {

   o:'تملّي معاك، ولو حتى بعيد عني\nفي قلبي هواك، وتملّي معاك'},
  {a:'أخاصمك آه — نانسي عجرم',
   f:'أُخاصمُك نعم، أمّا أن أتركَك فلا\nفأنت حبيبي وروحي معك',
   o:'أخاصمك آه، أسيبك لأ\nحبيبي إنت وروحي معاك'},
  {a:'سالمة يا سلامة — داليدا',
   f:'سالمةٌ يا سلامة\nذهبنا وعُدنا بالسلامة',
   o:'سالمة يا سلامة\nرحنا وجينا بالسلامة'},
  {a:'حلوة يا بلدي — داليدا',
   f:'كلمةٌ جميلة، وكلمتان\nما أجملَكِ يا بلادي',
   o:'كلمة حلوة وكلمتين\nحلوة يا بلدي'},
  {a:'طلعت يا محلا نورها — سيد درويش',
   f:'أشرقت، ما أجملَ نورَها، شمسُ الشموس\nهيّا بنا نملأُ ونحلبُ لبنَ الجاموسة',
   o:'طلعت يا محلا نورها شمس الشموسة\nيلّا بينا نملا ونحلب لبن الجاموسة'},
  {a:'شبابيك — محمد منير',
   f:'نوافذ…\nالدنيا كلُّها نوافذ',
   o:'شبابيك…\nالدنيا كلها شبابيك'},
  {a:'رجب — هيفاء وهبي',
   f:'يا رجب، أبعِدْ صاحبَك عنّي',
   o:'رجب، حوش صاحبك عني'},
];

/* ---------- state ---------- */
const DEF = {players:[], settings:{time:30,right:1,wrong:1,timeout:1,reopen:true,bank:true}, round:1, songIdx:0, order:null};
let S;
try { S = Object.assign({}, DEF, JSON.parse(localStorage.getItem('fusha-game')||'{}')); S.settings = Object.assign({}, DEF.settings, S.settings||{}); } catch(e){ S = JSON.parse(JSON.stringify(DEF)); }
if (!Array.isArray(S.order) || S.order.length !== BANK.length) S.order = shuffle([...BANK.keys()]);
const save = () => { try { localStorage.setItem('fusha-game', JSON.stringify(S)); } catch(e){} };

let phase = 'idle';      // idle | armed | answering | result
let current = null;      // player id answering
let locked = new Set();  // players already tried this song
let deadline = 0, raf = 0, lastTick = -1;

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
const uid = () => Math.random().toString(36).slice(2,9);
const byId = id => S.players.find(p=>p.id===id);
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- sound ---------- */
let ac;
function audio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); return ac; }
function tone(freq, dur, type='sine', vol=.3, when=0){
  const a = audio(); if(!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.01); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
const SND = {
  bell(){ [1318,1975,2637].forEach((f,i)=>tone(f,1.4-i*.3,'sine',.25/(i+1))); tone(1320,1.2,'triangle',.12,.18); },
  tick(){ tone(900,.06,'square',.08); },
  good(){ [523,659,784,1046].forEach((f,i)=>tone(f,.35,'triangle',.22,i*.09)); },
  bad(){ tone(180,.5,'sawtooth',.18); tone(140,.6,'sawtooth',.14,.12); },
  arm(){ tone(660,.12,'sine',.18); tone(990,.18,'sine',.18,.1); },
};
function vibrate(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

/* ---------- setup screen ---------- */
function renderSetup(){
  const chips = $('#chips');
  chips.innerHTML = S.players.map((p,i)=>`<div class="chip"><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>${esc(p.name)}<button data-del="${p.id}" aria-label="حذف">×</button></div>`).join('');
  $('#emptyMsg').classList.toggle('hidden', S.players.length>0);
  $('#emptyMsg').textContent = S.players.length===1 ? 'ضيف لاعب كمان على الأقل.' : 'ضيف لاعبين على الأقل لتبدأ.';
  if (S.players.length===1) $('#emptyMsg').classList.remove('hidden');
  $('#startBtn').disabled = S.players.length < 2;
  document.querySelectorAll('.step').forEach(el=>{ el.querySelector('b').textContent = S.settings[el.dataset.k]; });
  document.querySelectorAll('.toggle').forEach(el=>el.classList.toggle('on', !!S.settings[el.dataset.t]));
}
$('#addForm').addEventListener('submit', e=>{
  e.preventDefault();
  const n = $('#nameIn').value.trim();
  if(!n) return;
  if(S.players.length >= 12){ alert('الحد الأقصى ١٢ لاعب'); return; }
  S.players.push({id:uid(), name:n, score:0});
  $('#nameIn').value=''; $('#nameIn').focus();
  save(); renderSetup();
});
$('#chips').addEventListener('click', e=>{
  const id = e.target.dataset.del; if(!id) return;
  S.players = S.players.filter(p=>p.id!==id); save(); renderSetup();
});
document.querySelectorAll('.step').forEach(el=>{
  const [minus, , plus] = el.children, k = el.dataset.k, mn=+el.dataset.min, mx=+el.dataset.max, st=+el.dataset.st;
  minus.onclick = ()=>{ S.settings[k] = Math.max(mn, S.settings[k]-st); save(); renderSetup(); };
  plus.onclick  = ()=>{ S.settings[k] = Math.min(mx, S.settings[k]+st); save(); renderSetup(); };
});
document.querySelectorAll('.toggle').forEach(el=>el.onclick=()=>{ S.settings[el.dataset.t] = !S.settings[el.dataset.t]; save(); renderSetup(); });
$('#startBtn').onclick = ()=>{ audio(); show('game'); newSong(false); };

/* ---------- screens ---------- */
function show(id){ ['setup','game','end'].forEach(s=>$('#'+s).classList.toggle('hidden', s!==id)); if(id==='setup') renderSetup(); }
$('#backBtn').onclick = ()=>{ stopTimer(); phase='idle'; show('setup'); };
$('#endBtn').onclick = ()=>{ stopTimer(); phase='idle'; renderEnd(); show('end'); };
$('#resumeBtn').onclick = ()=>{ show('game'); render(); };
$('#againBtn').onclick = ()=>{ S.players.forEach(p=>p.score=0); S.round=1; save(); show('game'); newSong(false); };

/* ---------- song bank ---------- */
function renderSong(){
  $('#songBox').classList.toggle('hidden', !S.settings.bank);
  const s = BANK[S.order[S.songIdx % BANK.length]];
  $('#lyric').textContent = s.f;
  $('#ansTitle').textContent = '🎵 ' + s.a;
  $('#ansOrig').textContent = s.o;
  $('#answer').classList.add('blur');
  $('#revealBtn').textContent = 'إظهار الجواب';
  $('#songCount').textContent = `${(S.songIdx % BANK.length)+1} / ${BANK.length}`;
}
$('#revealBtn').onclick = ()=>{ const a=$('#answer'); a.classList.toggle('blur'); $('#revealBtn').textContent = a.classList.contains('blur')?'إظهار الجواب':'إخفاء الجواب'; };
$('#skipBtn').onclick = ()=>{ S.songIdx++; if(S.songIdx % BANK.length===0) S.order = shuffle([...BANK.keys()]); save(); renderSong(); };

/* ---------- game flow ---------- */
function newSong(advance=true){
  stopTimer();
  if(advance){ S.round++; S.songIdx++; if(S.songIdx % BANK.length===0) S.order = shuffle([...BANK.keys()]); }
  locked = new Set(); current = null; phase = 'idle';
  save(); renderSong(); render();
}
function arm(){ phase='armed'; current=null; SND.arm(); render(); }
function buzz(id){
  if(phase!=='armed' || locked.has(id)) return;
  phase='answering'; current=id; locked.add(id);
  SND.bell(); vibrate([60,40,60]);
  deadline = performance.now() + S.settings.time*1000; lastTick=-1;
  render();
}
function judge(kind){ // 'right' | 'wrong' | 'timeout'
  if(phase!=='answering') return;
  stopTimer();
  const p = byId(current);
  const d = kind==='right' ? S.settings.right : -S.settings[kind];
  p.score += d; save();
  kind==='right' ? SND.good() : SND.bad();
  const others = S.players.some(q=>!locked.has(q.id));
  const name = p.name;
  if(kind==='right'){
    phase='result'; render({msg:`✅ صح! ${name} +${d}`, delta:[p.id,d]});
  } else if(S.settings.reopen && others){
    phase='armed'; const who=current; current=null;
    render({msg: (kind==='timeout'?`⏰ خلص الوقت! ${name} ${d||''}`:`❌ غلط! ${name} ${d||''}`), sub:'الجرس مفتوح للباقيين', delta:[who,d]});
  } else {
    phase='result'; render({msg: (kind==='timeout'?`⏰ خلص الوقت! ${name} ${d||''}`:`❌ غلط! ${name} ${d||''}`), sub:'ما حدا عرفها', delta:[p.id,d]});
  }
}
function stopTimer(){ cancelAnimationFrame(raf); raf=0; }
function loop(){
  const left = Math.max(0, deadline - performance.now());
  const sec = Math.ceil(left/1000);
  const ring = document.querySelector('.timer .fg'), num = document.querySelector('.timer .num'), tm = document.querySelector('.timer');
  if(ring){ const C = 2*Math.PI*54; ring.style.strokeDasharray = C; ring.style.strokeDashoffset = C*(1 - left/(S.settings.time*1000)); }
  if(num) num.textContent = sec;
  if(tm) tm.classList.toggle('low', sec<=5);
  if(sec!==lastTick){ if(sec<=5 && sec>0) SND.tick(); lastTick=sec; }
  if(left<=0){ judge('timeout'); return; }
  raf = requestAnimationFrame(loop);
}

/* ---------- render game ---------- */
function render(info={}){
  $('#roundLbl').textContent = `الأغنية رقم ${S.round}`;
  const st = $('#status'), host = $('#host');
  const p = current && byId(current);

  if(phase==='idle'){
    st.innerHTML = `<div class="msg">احكي الأغنية بالفصحى… 🎤</div><div class="sub">لما تخلص اضغط «افتح الجرس» — قبلها الجرس ما بيشتغل</div>`;
    host.innerHTML = `<button class="btn gold big" data-a="arm">افتح الجرس 🔔</button>`;
  } else if(phase==='armed'){
    st.innerHTML = info.msg ? `<div class="msg">${esc(info.msg)}</div><div class="sub">${esc(info.sub||'')}</div>`
                            : `<div class="msg">الجرس مفتوح! مين بيعرفها؟</div><div class="sub">أوّل واحد بيضرب الجرس بيجاوب</div>`;
    host.innerHTML = `<button class="btn" data-a="next">ما حدا عرفها — أغنية ثانية</button>`;
  } else if(phase==='answering'){
    st.innerHTML = `<div class="answering">
        <div class="timer"><svg viewBox="0 0 120 120"><circle class="bgc" cx="60" cy="60" r="54"/><circle class="fg" cx="60" cy="60" r="54"/></svg><div class="num">${S.settings.time}</div></div>
        <div><div class="sub">بيجاوب هلّق:</div><div class="who">${esc(p.name)}</div></div>
      </div>`;
    host.innerHTML = `<div class="judge"><button class="btn good big" data-a="right">✓ صح</button><button class="btn bad big" data-a="wrong">✗ غلط</button></div>`;
  } else if(phase==='result'){
    st.innerHTML = `<div class="msg">${esc(info.msg||'')}</div><div class="sub">${esc(info.sub||'')}</div>`;
    host.innerHTML = `<button class="btn gold big" data-a="next">الأغنية الجاية ←</button>`;
    if(S.settings.bank && $('#answer').classList.contains('blur')) $('#revealBtn').click();
  }

  const bells = $('#bells');
  bells.parentElement.classList.toggle('armed', phase==='armed');
  bells.innerHTML = S.players.map((q,i)=>{
    const cls = ['bell'];
    if(q.id===current) cls.push('first');
    else if(phase==='answering' || (phase==='armed' && locked.has(q.id))) cls.push('out');
    return `<div class="${cls.join(' ')}" data-id="${q.id}" style="--c:${COLORS[i%COLORS.length]}">
      <span class="key">${KEYS[i]||''}</span>
      <span class="adj"><button data-adj="1" data-pid="${q.id}">+</button><button data-adj="-1" data-pid="${q.id}">−</button></span>
      <div class="dome">${EMOJI}</div>
      <div class="nm">${esc(q.name)}</div>
      <div class="sc">${q.score}</div>
    </div>`;
  }).join('');
  if(info.delta){
    const [id,d] = info.delta, el = bells.querySelector(`[data-id="${id}"]`);
    if(el && d){ const s=document.createElement('div'); s.className='delta'; s.style.color = d>0?'var(--good)':'var(--bad)'; s.textContent=(d>0?'+':'')+d; el.appendChild(s); }
  }
  if(phase==='answering') loop();
}

$('#host').addEventListener('click', e=>{
  const a = e.target.closest('[data-a]')?.dataset.a; if(!a) return;
  audio();
  if(a==='arm') arm();
  else if(a==='next') newSong(true);
  else if(a==='right' || a==='wrong') judge(a);
});
// الجرس: pointerdown ليكون أسرع من click، وأوّل واحد بيوصل بيكسب
$('#bells').addEventListener('pointerdown', e=>{
  const adj = e.target.closest('[data-adj]');
  if(adj){ e.stopPropagation(); const q=byId(adj.dataset.pid); q.score += +adj.dataset.adj; save(); const sc=adj.closest('.bell').querySelector('.sc'); sc.textContent=q.score; return; }
  const b = e.target.closest('.bell'); if(!b) return;
  e.preventDefault(); audio();
  b.classList.add('press'); setTimeout(()=>b.classList.remove('press'),120);
  buzz(b.dataset.id);
});
// كيبورد: كل لاعب إله حرف، و Enter/Space للمقدّم
document.addEventListener('keydown', e=>{
  if($('#game').classList.contains('hidden') || e.repeat) return;
  const k = e.key.toUpperCase();
  const i = KEYS.indexOf(k);
  if(i>=0 && i<S.players.length){ audio(); buzz(S.players[i].id); return; }
  if(e.key==='Enter' || e.key===' '){
    e.preventDefault();
    if(phase==='idle') arm(); else if(phase==='result') newSong(true);
  }
});

/* ---------- end ---------- */
function renderEnd(){
  const sorted = [...S.players].sort((a,b)=>b.score-a.score);
  const medals = ['🥇','🥈','🥉'];
  let pos=0, prev=null;
  $('#podium').innerHTML = sorted.map((p,i)=>{ if(p.score!==prev){pos=i;prev=p.score;} return `<div class="rank ${pos===0?'r1':''}"><span class="pos">${medals[pos]||pos+1}</span><span class="n">${esc(p.name)}</span><span class="s">${p.score}</span></div>`; }).join('');
  $('#endSub').textContent = `بعد ${S.round} أغنية`;
}

renderSetup();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
